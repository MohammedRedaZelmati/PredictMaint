# Spark 3.5.3 defaults for every SmartPredict job. Jobs must run on the standalone
# cluster (never local[*]) for the final proof.
spark.master                          spark://spark-master:7077
spark.hadoop.fs.defaultFS             hdfs://namenode:8020
spark.hadoop.dfs.replication          2
spark.hadoop.dfs.client.use.datanode.hostname true

# Initial low-RAM sizing (host has 16 GiB, ~2 GiB free at audit time). Worker = 1 core / 1 GiB,
# so executor + overhead must stay below that. Re-tune after real measurements.
spark.driver.memory                   768m
spark.executor.memory                 640m
spark.executor.cores                  1
spark.cores.max                       2
spark.sql.shuffle.partitions          4
spark.default.parallelism             4

# Driver runs in a container: bind everywhere, advertise per-service name
# (spark.driver.host is set per service in docker-compose.yml).
spark.driver.bindAddress              0.0.0.0

spark.sql.session.timeZone            UTC
spark.sql.streaming.metricsEnabled    false
